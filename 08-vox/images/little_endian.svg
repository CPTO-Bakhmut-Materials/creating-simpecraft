<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2933" role="img" aria-label="Little-endian: молодший байт першим">
<title>Little-endian: молодший байт першим</title>
<rect width="860" height="230" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" textLength="587.7" lengthAdjust="spacingAndGlyphs">Little-endian: число 94 880 у файлі записано як a0 72 01 00</text>
<rect x="20" y="52" width="90" height="66" rx="3" fill="#ede6f8" stroke="#7e4fc4" stroke-width="1"/>
<text x="65" y="80" font-size="17" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-weight="bold" text-anchor="middle" textLength="20.5" lengthAdjust="spacingAndGlyphs">a0</text>
<text x="65" y="104" font-size="12" text-anchor="middle" textLength="55.9" lengthAdjust="spacingAndGlyphs">b1 = 160</text>
<text x="65" y="144" font-size="17" font-weight="bold" text-anchor="middle" fill="#7e4fc4" textLength="32.0" lengthAdjust="spacingAndGlyphs">× 1</text>
<rect x="120" y="52" width="90" height="66" rx="3" fill="#ede6f8" stroke="#7e4fc4" stroke-width="1"/>
<text x="165" y="80" font-size="17" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-weight="bold" text-anchor="middle" textLength="20.5" lengthAdjust="spacingAndGlyphs">72</text>
<text x="165" y="104" font-size="12" text-anchor="middle" textLength="55.9" lengthAdjust="spacingAndGlyphs">b2 = 114</text>
<text x="165" y="144" font-size="17" font-weight="bold" text-anchor="middle" fill="#7e4fc4" textLength="55.6" lengthAdjust="spacingAndGlyphs">× 256</text>
<rect x="220" y="52" width="90" height="66" rx="3" fill="#ede6f8" stroke="#7e4fc4" stroke-width="1"/>
<text x="265" y="80" font-size="17" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-weight="bold" text-anchor="middle" textLength="20.5" lengthAdjust="spacingAndGlyphs">01</text>
<text x="265" y="104" font-size="12" text-anchor="middle" textLength="40.6" lengthAdjust="spacingAndGlyphs">b3 = 1</text>
<text x="265" y="144" font-size="17" font-weight="bold" text-anchor="middle" fill="#7e4fc4" textLength="63.1" lengthAdjust="spacingAndGlyphs">× 256²</text>
<rect x="320" y="52" width="90" height="66" rx="3" fill="#ede6f8" stroke="#7e4fc4" stroke-width="1"/>
<text x="365" y="80" font-size="17" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-weight="bold" text-anchor="middle" textLength="20.5" lengthAdjust="spacingAndGlyphs">00</text>
<text x="365" y="104" font-size="12" text-anchor="middle" textLength="40.6" lengthAdjust="spacingAndGlyphs">b4 = 0</text>
<text x="365" y="144" font-size="17" font-weight="bold" text-anchor="middle" fill="#7e4fc4" textLength="63.1" lengthAdjust="spacingAndGlyphs">× 256³</text>
<text x="430" y="80" font-size="12" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" textLength="296.3" lengthAdjust="spacingAndGlyphs">= 160 + 114·256 + 1·65 536 + 0·16 777 216</text>
<text x="430" y="104" font-size="12" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-weight="bold" textLength="57.8" lengthAdjust="spacingAndGlyphs">= 94 880</text>
<text x="20" y="200" font-size="12" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" textLength="592.6" lengthAdjust="spacingAndGlyphs">readU32: b1 + b2·0x100 + b3·0x10000 + b4·0x1000000   (розмір дочірніх чанків MAIN)</text>
</svg>
