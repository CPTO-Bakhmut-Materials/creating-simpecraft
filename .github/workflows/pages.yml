# Builds the book with mdBook and publishes it to GitHub Pages on every push to master/main.
name: Book

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # mdBook, mdbook-katex and love.js — pinned in tools/versions.env, fetched by tools/build.sh.
      - uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('tools/versions.env') }}
      - run: tools/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
