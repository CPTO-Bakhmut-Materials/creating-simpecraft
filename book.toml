[book]
title = "Minecraft на LÖVE: 3D-графіка з нуля"
description = "Навчальний курс для професії 4113 «Оператор з обробки інформації та програмного забезпечення»"
language = "uk"
src = "."

[build]
build-dir = "book"
create-missing = false
# No default index preprocessor: it would turn README.md into index.html and break
# the links between lessons (../01-window/README.md).
use-default-preprocessors = false

[preprocessor.links]

# LaTeX formulas: $...$ inline, $$...$$ as a block. KaTeX renders them at build time,
# and GitHub shows the same markup in the README files.
# Needs mdbook-katex 0.9.x (compatible with mdBook 0.4); pinned in tools/versions.env.
[preprocessor.katex]
after = ["links"]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
additional-css = ["theme/katex.css", "theme/demo.css", "theme/rgb-mixer.css"]
# The "RGB model" widget in lesson 1 (<div class="rgb-mixer"> in the Markdown).
additional-js = ["theme/rgb-mixer.js"]

# mdBook's built-in search (elasticlunr) drops Cyrillic words, so it finds nothing
# in Ukrainian text. Disabled so it doesn't mislead readers.
[output.html.search]
enable = false
