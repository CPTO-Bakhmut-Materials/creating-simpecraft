[book]
title = "Minecraft на LÖVE: 3D-графіка з нуля"
description = "Навчальний курс для професії 4113 «Оператор з обробки інформації та програмного забезпечення»"
language = "uk"
src = "."

[build]
build-dir = "book"
create-missing = false
# Без стандартного препроцесора index: інакше README.md перетворюються на index.html
# і посилання між уроками (../01-window/README.md) ламаються.
use-default-preprocessors = false

[preprocessor.links]

# Формули LaTeX: $...$ у рядку, $$...$$ окремим блоком. KaTeX рендерить їх під час
# збирання, а GitHub показує ту саму розмітку у файлах README.
# Потрібна програма mdbook-katex 0.9.x (сумісна з mdBook 0.4), див. .github/workflows/pages.yml.
[preprocessor.katex]
after = ["links"]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
additional-css = ["theme/katex.css", "theme/demo.css", "theme/rgb-mixer.css"]
# Віджет «модель RGB» в уроці 1 (<div class="rgb-mixer"> у Markdown).
additional-js = ["theme/rgb-mixer.js"]

# Вбудований пошук mdBook (elasticlunr) відкидає кириличні слова, тож для
# українського тексту він нічого не знаходить. Вимикаємо, щоб не вводити в оману.
[output.html.search]
enable = false
