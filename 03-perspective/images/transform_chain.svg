<text x="360" y="191.6" font-size="12" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" text-anchor="middle" fill="#6b7785" textLength="93.9" lengthAdjust="spacingAndGlyphs">(perspective)</text>
