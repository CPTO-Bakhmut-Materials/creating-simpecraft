<text x="720" y="191.6" font-size="12" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" text-anchor="middle" fill="#6b7785" textLength="86.7" lengthAdjust="spacingAndGlyphs">(відеокарта)</text>
<rect x="15" y="228" width="870" height="40" rx="4" fill="#fbf1cf" stroke="#d9a400" stroke-width="1"/>
<text x="450" y="253" font-size="12" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" text-anchor="middle" textLength="599.8" lengthAdjust="spacingAndGlyphs">у шейдері:  viewProjection * vertexPosition,  де viewProjection = projection * view</text>
