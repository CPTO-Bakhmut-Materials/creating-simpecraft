<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2933" role="img" aria-label="Порядок обходу вершин: лицьова і тильна сторона">
<title>Порядок обходу вершин: лицьова і тильна сторона</title>
<rect width="860" height="400" fill="#ffffff"/>
<text x="220" y="28" font-size="17" font-weight="bold" text-anchor="middle" fill="#3a9a4e" textLength="168.8" lengthAdjust="spacingAndGlyphs">Дивимося ззовні:</text>
<text x="220" y="50.1" font-size="17" font-weight="bold" text-anchor="middle" fill="#3a9a4e" textLength="253.7" lengthAdjust="spacingAndGlyphs">1→2→3 проти год. стрілки</text>
<path d="M100,310 L340,310 L220,100 Z" fill="#c1dfc5" stroke="#3a9a4e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
