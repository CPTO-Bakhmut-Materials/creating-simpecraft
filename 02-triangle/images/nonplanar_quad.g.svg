<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2933" role="img" aria-label="Три точки завжди в одній площині, чотири — не завжди">
<title>Три точки завжди в одній площині, чотири — не завжди</title>
<rect width="920" height="340" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" textLength="247.6" lengthAdjust="spacingAndGlyphs">3 точки — одна площина</text>
<path d="M13.6,246 L184.1,300.5 L327.3,203.5 L156.8,148.9 Z" fill="#eceef1" stroke="#7a8594" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
<path d="M60,220 L178.9,254.7 L177.7,189.6 Z" fill="#4a82e0" stroke="#1f2933" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="60" cy="220" r="4.5" fill="#1f2933"/>
<text x="60" y="246" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">1</text>
<circle cx="178.9" cy="254.7" r="4.5" fill="#1f2933"/>
<text x="178.9" y="278.6" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">2</text>
<circle cx="177.7" cy="189.6" r="4.5" fill="#1f2933"/>
<text x="177.7" y="177.6" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">3</text>
<text x="20" y="325" font-size="12" fill="#6b7785" textLength="245.5" lengthAdjust="spacingAndGlyphs">площину задають напрямки 1→2 і 1→3</text>
<text x="335" y="30" font-size="17" font-weight="bold" textLength="137.5" lengthAdjust="spacingAndGlyphs">Діагональ 1–3</text>
<text x="335" y="58" font-size="17" fill="#6b7785" textLength="83.0" lengthAdjust="spacingAndGlyphs">«хребет»</text>
<path d="M598,215 L598,132.5" fill="none" stroke="#7a8594" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="3 3"/>
<circle cx="598" cy="215" r="3.5" fill="#ffffff" stroke="#7a8594" stroke-width="1"/>
<path d="M355,230 L505,278 L598,132.5 Z" fill="#3976dd" stroke="#1f2933" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M355,230 L598,132.5 L448,167 Z" fill="#3f7ade" stroke="#1f2933" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="355" cy="230" r="4.5" fill="#1f2933"/>
<text x="339" y="250" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">1</text>
<circle cx="505" cy="278" r="4.5" fill="#1f2933"/>
<text x="519" y="296" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">2</text>
<circle cx="598" cy="132.5" r="4.5" fill="#1f2933"/>
<text x="612" y="126.5" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">3</text>
<circle cx="448" cy="167" r="4.5" fill="#1f2933"/>
<text x="434" y="163" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">4</text>
<text x="625" y="30" font-size="17" font-weight="bold" textLength="137.5" lengthAdjust="spacingAndGlyphs">Діагональ 2–4</text>
<text x="625" y="58" font-size="17" fill="#6b7785" textLength="86.4" lengthAdjust="spacingAndGlyphs">«долина»</text>
<path d="M888,215 L888,132.5" fill="none" stroke="#7a8594" stroke-width="1" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="3 3"/>
<circle cx="888" cy="215" r="3.5" fill="#ffffff" stroke="#7a8594" stroke-width="1"/>
<path d="M645,230 L795,278 L738,167 Z" fill="#4a82e0" stroke="#1f2933" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M795,278 L888,132.5 L738,167 Z" fill="#2f6fdb" stroke="#1f2933" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="645" cy="230" r="4.5" fill="#1f2933"/>
<text x="629" y="250" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">1</text>
<circle cx="795" cy="278" r="4.5" fill="#1f2933"/>
<text x="809" y="296" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">2</text>
<circle cx="888" cy="132.5" r="4.5" fill="#1f2933"/>
<text x="902" y="126.5" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">3</text>
<circle cx="738" cy="167" r="4.5" fill="#1f2933"/>
<text x="724" y="163" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">4</text>
<text x="335" y="325" font-size="12" fill="#6b7785" textLength="308.1" lengthAdjust="spacingAndGlyphs">ті самі 4 кути, кут 3 піднято — дві різні поверхні</text>
</svg>
