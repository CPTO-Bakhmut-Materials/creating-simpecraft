<path d="M345,90 L367.2,90" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="555" y="20" width="150" height="140" rx="8" fill="#fbece1" stroke="#e8833a" stroke-width="2"/>
<text x="630" y="64.4" font-size="17" font-weight="bold" text-anchor="middle" textLength="112.0" lengthAdjust="spacingAndGlyphs">Піксельний</text>
<text x="630" y="86.5" font-size="17" font-weight="bold" text-anchor="middle" textLength="78.9" lengthAdjust="spacingAndGlyphs">шейдер</text>
<text x="630" y="111.9" font-size="12" text-anchor="middle" textLength="97.1" lengthAdjust="spacingAndGlyphs">якого кольору?</text>
<text x="630" y="127.5" font-size="12" text-anchor="middle" textLength="100.7" lengthAdjust="spacingAndGlyphs">(раз на піксель)</text>
<path d="M555,90 L545.4,93.9 L545.4,86.1 Z" fill="#1f2933"/>
<path d="M525,90 L547.2,90" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="735" y="20" width="150" height="140" rx="8" fill="#e4f1e6" stroke="#3a9a4e" stroke-width="2"/>
<text x="810" y="83.3" font-size="17" font-weight="bold" text-anchor="middle" textLength="51.3" lengthAdjust="spacingAndGlyphs">Кадр</text>
<text x="810" y="108.7" font-size="12" text-anchor="middle" textLength="59.8" lengthAdjust="spacingAndGlyphs">на екрані</text>
<path d="M735,90 L725.4,93.9 L725.4,86.1 Z" fill="#1f2933"/>
<path d="M705,90 L727.2,90" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<text x="270" y="190" font-size="12" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" text-anchor="middle" fill="#2f6fdb" textLength="122.9" lengthAdjust="spacingAndGlyphs">наш VERTEX_SHADER</text>
<text x="450" y="190" font-size="12" text-anchor="middle" fill="#7e4fc4" textLength="118.1" lengthAdjust="spacingAndGlyphs">робить відеокарта</text>
<text x="450" y="205.6" font-size="12" text-anchor="middle" fill="#7e4fc4" textLength="50.6" lengthAdjust="spacingAndGlyphs">і змішує</text>
<text x="450" y="221.2" font-size="12" text-anchor="middle" fill="#7e4fc4" textLength="104.6" lengthAdjust="spacingAndGlyphs">кольори вершин</text>
<text x="630" y="190" font-size="12" text-anchor="middle" fill="#e8833a" textLength="52.7" lengthAdjust="spacingAndGlyphs">поки що</text>
<text x="630" y="205.6" font-size="12" text-anchor="middle" fill="#e8833a" textLength="82.5" lengthAdjust="spacingAndGlyphs">стандартний</text>
