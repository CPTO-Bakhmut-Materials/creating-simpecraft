<text x="270" y="86.5" font-size="17" font-weight="bold" text-anchor="middle" textLength="78.9" lengthAdjust="spacingAndGlyphs">шейдер</text>
<text x="270" y="111.9" font-size="12" text-anchor="middle" textLength="85.7" lengthAdjust="spacingAndGlyphs">де на екрані?</text>
<text x="270" y="127.5" font-size="12" text-anchor="middle" textLength="109.4" lengthAdjust="spacingAndGlyphs">(раз на вершину)</text>
<path d="M195,90 L185.4,93.9 L185.4,86.1 Z" fill="#1f2933"/>
<path d="M165,90 L187.2,90" fill="none" stroke="#1f2933" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="375" y="20" width="150" height="140" rx="8" fill="#ede6f8" stroke="#7e4fc4" stroke-width="2"/>
<text x="450" y="75.5" font-size="17" font-weight="bold" text-anchor="middle" textLength="130.2" lengthAdjust="spacingAndGlyphs">Растеризація</text>
<text x="450" y="100.8" font-size="12" text-anchor="middle" textLength="65.0" lengthAdjust="spacingAndGlyphs">які пікселі</text>
<text x="450" y="116.4" font-size="12" text-anchor="middle" textLength="71.9" lengthAdjust="spacingAndGlyphs">покриває △</text>
