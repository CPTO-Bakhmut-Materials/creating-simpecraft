<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2933" role="img" aria-label="Конвеєр рендерингу">
<title>Конвеєр рендерингу</title>
<rect width="900" height="250" fill="#ffffff"/>
<rect x="15" y="20" width="150" height="140" rx="8" fill="#eceef1" stroke="#7a8594" stroke-width="2"/>
<text x="90" y="72.2" font-size="17" font-weight="bold" text-anchor="middle" textLength="90.3" lengthAdjust="spacingAndGlyphs">Вершини</text>
<text x="90" y="94.3" font-size="17" font-weight="bold" text-anchor="middle" textLength="66.2" lengthAdjust="spacingAndGlyphs">(Mesh)</text>
<text x="90" y="119.7" font-size="12" text-anchor="middle" textLength="62.7" lengthAdjust="spacingAndGlyphs">x, y, колір</text>
<rect x="195" y="20" width="150" height="140" rx="8" fill="#e3ebfa" stroke="#2f6fdb" stroke-width="2"/>
