<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2933" role="img" aria-label="Правильний і неправильний поділ квадрата на трикутники">
<title>Правильний і неправильний поділ квадрата на трикутники</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d64545" stroke-width="1.2"/></pattern></defs>
<rect width="860" height="400" fill="#ffffff"/>
<text x="170" y="34" font-size="17" font-weight="bold" text-anchor="middle" fill="#3a9a4e" textLength="294.7" lengthAdjust="spacingAndGlyphs">Правильно: { 1, 2, 3,  1, 3, 4 }</text>
<path d="M60,300 L280,300 L280,80 Z" fill="#aac4f0" stroke="#2f6fdb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M60,300 L280,80 L60,80 Z" fill="#f6cdb0" stroke="#e8833a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
