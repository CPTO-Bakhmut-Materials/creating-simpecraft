<text x="130.4" y="159.2" font-size="17" font-weight="bold" text-anchor="middle" fill="#e8833a" textLength="24.9" lengthAdjust="spacingAndGlyphs">△2</text>
<circle cx="60" cy="300" r="5" fill="#1f2933"/>
<text x="46" y="322" font-size="17" font-weight="bold" text-anchor="middle" textLength="11.8" lengthAdjust="spacingAndGlyphs">1</text>
