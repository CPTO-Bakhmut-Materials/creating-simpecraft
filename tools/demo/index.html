<!doctype html>
<!-- Сторінка демо уроку (tools/build-demos.sh підставляє __TITLE__ і __RUNTIME__ — відносний
     шлях до спільного рушія book/demo-runtime). Вбудовується в урок
     через <iframe>; ?poster=… — статична картинка, якщо WebGL 2 немає або демо не запустилося. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87bdf2; }
    /* Буфер полотна — 1280×720 (вікно гри), тут лише масштабуємо його під рамку. */
    canvas { display: block; width: 100% !important; height: 100% !important; object-fit: contain; }
    #status {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 16px sans-serif; color: #1f2933;
    }
    #poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Завантаження демо…</div>
<img id="poster" alt="">
<script>
    // Не «status»: глобальна змінна з такою назвою — це вбудований рядок window.status.
    var statusEl = document.getElementById("status");
    var poster = new URLSearchParams(location.search).get("poster");

    function fallback(message) {
        if (poster) {
            var img = document.getElementById("poster");
            img.src = poster;
            img.style.display = "block";
            statusEl.style.display = "none";
        } else {
            statusEl.textContent = message;
        }
        document.getElementById("canvas").style.display = "none";
    }

    function loadScript(src, onload) {
        var s = document.createElement("script");
        s.src = src;
        s.onload = onload;
        s.onerror = function () { fallback("Не вдалося завантажити демо"); };
        document.body.appendChild(s);
    }

    if (!document.createElement("canvas").getContext("webgl2")) {
        fallback("Для демо потрібен браузер з WebGL 2");
    } else {
        var Module = {
            arguments: ["./"],
            INITIAL_MEMORY: 16777216,
            printErr: console.error.bind(console),
            canvas: document.getElementById("canvas"),
            setStatus: function () {},
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                if (!left) statusEl.style.display = "none";
            },
        };
        window.onerror = function () { fallback("Демо зупинилося з помилкою"); };
        // game.js — файли уроку (свої для кожного демо); love.js і love.wasm — спільні для всієї книги.
        loadScript("game.js", function () {
            loadScript("__RUNTIME__/love.js", function () { Love(Module); });
        });
    }
</script>
</body>
</html>
