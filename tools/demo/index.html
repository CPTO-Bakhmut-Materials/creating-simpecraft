<!doctype html>
<!-- Lesson demo page (tools/build-demos.sh fills in __TITLE__ and __RUNTIME__, the relative
     path to the shared runtime in book/demo-runtime). Embedded in a lesson via <iframe>;
     ?poster=… is a static image shown if WebGL 2 is missing or the demo fails to start.
     Visible messages are Ukrainian on purpose: readers of the book see them. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #87bdf2; }
    /* The canvas buffer is 1280×720 (the game window); here it is only scaled to fit the frame. */
    canvas { display: block; width: 100% !important; height: 100% !important; object-fit: contain; }
    #status {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 16px sans-serif; color: #1f2933;
    }
    #poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Завантаження демо…</div>
<img id="poster" alt="">
<script>
    // Not "status": a global with that name is the built-in string window.status.
    var statusEl = document.getElementById("status");
    var poster = new URLSearchParams(location.search).get("poster");

    function fallback(message) {
        if (poster) {
            var img = document.getElementById("poster");
            img.src = poster;
            img.style.display = "block";
            statusEl.style.display = "none";
        } else {
            statusEl.textContent = message;
        }
        document.getElementById("canvas").style.display = "none";
    }

    function loadScript(src, onload) {
        var s = document.createElement("script");
        s.src = src;
        s.onload = onload;
        s.onerror = function () { fallback("Не вдалося завантажити демо"); };
        document.body.appendChild(s);
    }

    if (!document.createElement("canvas").getContext("webgl2")) {
        fallback("Для демо потрібен браузер з WebGL 2");
    } else {
        var Module = {
            arguments: ["./"],
            INITIAL_MEMORY: 16777216,
            printErr: console.error.bind(console),
            canvas: document.getElementById("canvas"),
            setStatus: function () {},
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                if (!left) statusEl.style.display = "none";
            },
        };
        window.onerror = function () { fallback("Демо зупинилося з помилкою"); };
        // game.js holds the lesson's files (one per demo); love.js and love.wasm are shared by the whole book.
        loadScript("game.js", function () {
            loadScript("__RUNTIME__/love.js", function () { Love(Module); });
        });
    }
</script>
</body>
</html>
