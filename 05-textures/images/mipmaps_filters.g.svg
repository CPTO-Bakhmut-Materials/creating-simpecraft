<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2933" role="img" aria-label="Мипмапи і фільтри збільшення">
<title>Мипмапи і фільтри збільшення</title>
<rect width="900" height="420" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" textLength="468.5" lengthAdjust="spacingAndGlyphs">Мипмапи: заздалегідь зменшені копії текстури</text>
<image x="20" y="172" width="128" height="128" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="20" y="172" width="128" height="128" fill="none" stroke="#7a8594" stroke-width="1"/>
<text x="84" y="322" font-size="12" font-weight="bold" text-anchor="middle" textLength="60.2" lengthAdjust="spacingAndGlyphs">128×128</text>
<image x="168" y="236" width="64" height="64" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="168" y="236" width="64" height="64" fill="none" stroke="#7a8594" stroke-width="1"/>
<text x="200" y="322" font-size="12" font-weight="bold" text-anchor="middle" textLength="43.5" lengthAdjust="spacingAndGlyphs">64×64</text>
<image x="252" y="268" width="32" height="32" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="252" y="268" width="32" height="32" fill="none" stroke="#7a8594" stroke-width="1"/>
<text x="268" y="322" font-size="12" font-weight="bold" text-anchor="middle" textLength="43.5" lengthAdjust="spacingAndGlyphs">32×32</text>
<image x="316" y="284" width="16" height="16" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="316" y="284" width="16" height="16" fill="none" stroke="#7a8594" stroke-width="1"/>
<text x="324" y="322" font-size="12" font-weight="bold" text-anchor="middle" textLength="43.5" lengthAdjust="spacingAndGlyphs">16×16</text>
<image x="380" y="292" width="8" height="8" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAbElEQVR42iXNQZUCMBQEwZ5J1s6Kwyd+eJD85kAZqPw/H2nmc9N4J6uOgc0dDQphJKI09Q6ahIaEJIlj87c8Q+P7EFQ1q5sxeyHZi4Ag3ikN6rkAV++wmtVmlya7jr+AM4R6xnPndZKoNCryBQMsUF1zjxg0AAAAAElFTkSuQmCC"/>
<rect x="380" y="292" width="8" height="8" fill="none" stroke="#7a8594" stroke-width="1"/>
<text x="384" y="322" font-size="12" font-weight="bold" text-anchor="middle" textLength="26.8" lengthAdjust="spacingAndGlyphs">8×8</text>
<image x="444" y="296" width="4" height="4" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAALUlEQVR42jXGwQ0AIRADsZkV9dDbFXodoYQXftn9f6RN0ekJgALL8d1BmwLQC6/zDXDcuQhAAAAAAElFTkSuQmCC"/>
<rect x="444" y="296" width="4" height="4" fill="none" stroke="#7a8594" stroke-width="1"/>
<text x="446" y="322" font-size="12" font-weight="bold" text-anchor="middle" textLength="26.8" lengthAdjust="spacingAndGlyphs">4×4</text>
<text x="20" y="355" font-size="12" textLength="422.3" lengthAdjust="spacingAndGlyphs">Далекий блок займає кілька пікселів — відеокарта бере маленьку</text>
<text x="20" y="370.6" font-size="12" textLength="391.9" lengthAdjust="spacingAndGlyphs">копію замість того, щоб вибирати випадкові пікселі з великої</text>
<text x="20" y="386.2" font-size="12" textLength="203.1" lengthAdjust="spacingAndGlyphs">(інакше далечінь «мерехтить»).</text>
<text x="520" y="30" font-size="17" font-weight="bold" textLength="372.6" lengthAdjust="spacingAndGlyphs">Збільшення: 16×16 пікселів зблизька</text>
<text x="605" y="82" font-size="12" font-weight="bold" text-anchor="middle" fill="#3a9a4e" textLength="152.4" lengthAdjust="spacingAndGlyphs">збільшення «nearest»</text>
<image x="520" y="96" width="170" height="170" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/>
<rect x="520" y="96" width="170" height="170" fill="none" stroke="#7a8594" stroke-width="1"/>
<text x="795" y="82" font-size="12" font-weight="bold" text-anchor="middle" fill="#e8833a" textLength="139.6" lengthAdjust="spacingAndGlyphs">збільшення «linear»</text>
<image x="710" y="96" width="170" height="170" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="710" y="96" width="170" height="170" fill="none" stroke="#7a8594" stroke-width="1"/>
<text x="520" y="300" font-size="12" textLength="218.5" lengthAdjust="spacingAndGlyphs">У грі: setFilter(&quot;linear&quot;, &quot;nearest&quot;) —</text>
<text x="520" y="315.6" font-size="12" textLength="241.4" lengthAdjust="spacingAndGlyphs">зменшення плавне, збільшення чітке.</text>
</svg>
