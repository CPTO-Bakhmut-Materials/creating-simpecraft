<text x="120" y="355.9" font-size="12" text-anchor="middle" textLength="94.4" lengthAdjust="spacingAndGlyphs">чекаємо vsync,</text>
<text x="120" y="371.5" font-size="12" text-anchor="middle" textLength="66.4" lengthAdjust="spacingAndGlyphs">міряємо dt</text>
