<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f2933" role="img" aria-label="Ігровий цикл LÖVE">
<title>Ігровий цикл LÖVE</title>
<rect width="860" height="430" fill="#ffffff"/>
