<text x="420" y="85.8" font-size="12" text-anchor="middle" textLength="103.7" lengthAdjust="spacingAndGlyphs">клавіші, миша →</text>
<text x="420" y="101.4" font-size="12" text-anchor="middle" textLength="113.0" lengthAdjust="spacingAndGlyphs">love.keypressed …</text>
