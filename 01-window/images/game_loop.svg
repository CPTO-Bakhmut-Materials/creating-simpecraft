<text x="720" y="198.3" font-size="17" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-weight="bold" text-anchor="middle" textLength="153.5" lengthAdjust="spacingAndGlyphs">love.update(dt)</text>
<text x="720" y="223.7" font-size="12" text-anchor="middle" textLength="117.9" lengthAdjust="spacingAndGlyphs">змінюємо стан гри</text>
